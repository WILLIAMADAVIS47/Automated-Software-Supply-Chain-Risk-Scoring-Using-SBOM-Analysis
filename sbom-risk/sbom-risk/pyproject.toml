[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sbomrisk"
version = "0.1.0"
description = "Rule-based supply chain risk scoring for CycloneDX SBOMs (CS 690 Graduate Research Project)"
authors = [{ name = "William A. Davis" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sbomrisk = "sbomrisk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
